{% extends "base.html" %}

{% block page_title %}Password Changed{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 text-center">
  <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm p-8">
    <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Password Updated</h2>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">
      Your password has been changed successfully. You can continue using SubSentinel.
    </p>
    <a href="{% url 'core:dashboard' %}" class="inline-flex px-5 py-2.5 rounded-xl bg-primary text-white text-sm font-semibold hover:bg-primary-600 transition-colors">
      Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
