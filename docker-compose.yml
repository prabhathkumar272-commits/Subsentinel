# ---------------------------------------------------------------------------
# SubSentinel – Docker Compose (development / staging)
# ---------------------------------------------------------------------------
version: "3.9"

x-common-env: &common-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in .env}
  # Local HTTP defaults are supplied by .env.example; enable these behind TLS.
  SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-False}"
  SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-0}"
  SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-False}"
  CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-False}"
  DB_NAME: ${DB_NAME:-subsentinel}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  EMAIL_HOST: ${EMAIL_HOST:?Set EMAIL_HOST in .env}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: "${EMAIL_USE_TLS:-True}"
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@subsentinel.com}

services:
  # ---------- Web application ----------
  web:
    build: .
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8000}:8000"
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    restart: unless-stopped

  # ---------- PostgreSQL ----------
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-subsentinel}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- Celery Worker ----------
  celery-worker:
    build: .
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=2
      -Q default
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Celery Beat ----------
  celery-beat:
    build: .
    command: >
      celery -A config beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
